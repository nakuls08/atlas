  - { id: shipping/tracking-api, name: Tracking API, hostedBy: shipping/tracking-service,
      style: REST, audience: partner }
topics:
  - { id: shipping/shipment-tracked, name: shipment.tracked.v1,
      ownedBy: shipping/tracking-service, cluster: logistics-main }
channels:
