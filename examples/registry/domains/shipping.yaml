domain: { id: shipping, name: Shipping, department: logistics, owningTeam: team-shipping,
          reviewedAt: 2026-02-02, reviewedBy: priya }
systems:
  - { id: shipping/carrier-integration, name: Carrier integration }
services:
  - { id: shipping/label-service, name: label-service, owningTeam: team-shipping,
      system: shipping/carrier-integration }
  - { id: shipping/tracking-service, name: tracking-service, owningTeam: team-shipping,
      system: shipping/carrier-integration }
  - { id: shipping/dispatch-planner, name: dispatch-planner, owningTeam: team-shipping,
      ownership: disputed, claimant: returns }
apis:
