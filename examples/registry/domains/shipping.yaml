  - { from: shipping/dhl-manifest-sftp, to: ext/dhl }
  - { from: shipping/tracking-service, to: shipping/shipment-tracked }
  - { from: shipping/shipment-tracked, to: returns/returns-intake }
  - { from: shipping/dispatch-planner, to: shipping/label-api }
  - { from: shipping/dispatch-planner, to: returns/returns-intake, gap: "legacy, no spec" }
  - { from: shipping/dispatch-planner, to: identity/auth-api }
